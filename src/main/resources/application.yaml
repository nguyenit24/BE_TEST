server:
  port: ${PORT:8080}

spring:
  datasource:
    # Railway MySQL sử dụng biến MYSQL_URL hoặc tự set
    url: ${MYSQL_URL:${SPRING_DATASOURCE_URL}}
    username: ${MYSQLUSER:${SPRING_DATASOURCE_USERNAME}}
    password: ${MYSQLPASSWORD:${SPRING_DATASOURCE_PASSWORD}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 60000
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
  
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    open-in-view: false
  
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
  
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            trust: smtp.gmail.com

springdoc:
  api-docs:
    path: ${SPRINGDOC_API_DOCS_PATH:/api-docs}

momo:
  partnerCode: ${MOMO_PARTNER_CODE:default}
  accessKey: ${MOMO_ACCESS_KEY:default}
  secretKey: ${MOMO_SECRET_KEY:default}
  endpoint: ${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api}
  returnUrl: ${MOMO_RETURN_URL:http://localhost:8080/payment/momo/return}
  ipn-url: ${MOMO_IPN_URL:http://localhost:8080/payment/momo/ipn}
  requestType: ${MOMO_REQUEST_TYPE:payWithMethod}

  
jwt:
  Key: ${JWT_KEY}

frontend:
  base-url: ${FRONTEND_BASE_URL}

qr:
  code:
    upload:
      path: ${QR_CODE_UPLOAD_PATH:/app/uploads}
    base:
      url: ${QR_CODE_BASE_URL}